services:
  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    ports:
      - "8000:80"

  ollama:
    image: ollama/ollama:latest
    container_name: second-mind-ollama
    tty: true
    restart: unless-stopped
    networks:
      - llm-network
    ports:
      - "11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all 
              capabilities: [gpu]

networks:
  llm-network:
    driver: bridge